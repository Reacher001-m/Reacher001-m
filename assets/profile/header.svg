<svg xmlns="http://www.w3.org/2000/svg" width="640" height="210" viewBox="0 0 640 210" role="img" aria-label="Reacher001-m terminal profile">
  <rect width="100%" height="100%" rx="8" fill="#0d1511"/>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace"><style>
  @keyframes type { from { transform:scaleX(0) } to { transform:scaleX(1) } }
  @keyframes cursor { 50% { opacity:0 } }
  @media (prefers-reduced-motion:no-preference) {
    .reveal { animation:type .9s steps(8,end) both }
    .cursor { animation:cursor .8s step-end 3 }
  }
  </style>
  <defs><clipPath id="cmd"><rect class="reveal" width="158" height="55"/></clipPath></defs>
  <text clip-path="url(#cmd)" x="22" y="37" fill="#67ef99" font-size="21">~ $ whoami</text>
  <text x="20" y="87" fill="#ffffff" font-size="42" font-weight="700">Reacher001-m</text>
  <text x="22" y="129" fill="#67ef99" font-size="21">~ $ cat focus.txt</text>
  <text x="22" y="161" fill="#ffffff" font-size="21">CS student building at hackathons.</text>
  <text x="22" y="189" fill="#ffffff" font-size="21">Exploring local LLMs, RAG and AI agents.</text>
  <rect class="cursor" x="537" y="172" width="10" height="20" fill="#67ef99"/></g>
</svg>
